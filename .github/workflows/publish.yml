name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: node bin/station-metadata.mjs validate
      # No check-slugs here: it requires every catalogue file for both kinds, and
      # this repo ships none. The published table is guarded on every pull request
      # by ci.yml's comparison against the previous release tag.
      - run: npm run check:data
      - run: npm pack --dry-run
      - run: npm publish
