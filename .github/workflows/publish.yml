name: publish
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: node bin/station-metadata.mjs validate
      # No check-slugs here: it requires every catalogue file for both kinds, and
      # this repo ships none. The published table is guarded on every pull request
      # by ci.yml's comparison against the previous release tag.
      - run: npm run check:data
      - run: npm pack --dry-run
      - run: npm publish
