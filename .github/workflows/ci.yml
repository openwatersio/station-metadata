name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 pulls full history and all tags. The slug check below
      # diffs against the previous release tag; the default shallow clone has
      # no tags and no history past this commit, so that comparison would
      # silently find nothing to compare against and pass every time.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Runs the JS tests and type-checks the shipped declarations against
      # consumer-shaped usage, so index.d.ts cannot drift from the runtime.
      - run: npm test
      # The corrections file is hand-edited and PR-able, so it is checked on
      # every change: reason required with position, no context that restates
      # the name, no duplicate slugs.
      #
      # No stations file to pass here, so the distance-from-published check
      # sits out - it needs the provider's own list, which this repo does not
      # ship. Consumers that have one get it via `validate <stations.json>`.
      - run: node bin/station-metadata.mjs validate
      - name: Check no published slug moved since the last release
        run: |
          # The prior record must be one this commit cannot edit. Comparing the
          # working tree against itself proves nothing once the table is an
          # input rather than a derivation. Checkout above already fetched
          # full history and all tags, so no fetch is needed here.
          export PREV=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)
          if [ -z "$PREV" ]; then echo "no previous tag; skipping"; exit 0; fi
          git show "$PREV:data/slugs.json" > /tmp/previous-slugs.json 2>/dev/null || {
            echo "no slug table at $PREV; skipping"; exit 0; }
          node -e '
            const { checkSlugTable } = await import("./src/slug-table.js");
            const fs = await import("node:fs");
            const prev = JSON.parse(fs.readFileSync("/tmp/previous-slugs.json", "utf8"));
            const now = JSON.parse(fs.readFileSync("data/slugs.json", "utf8"));
            // The file is committed, but a run against a commit that predates
            // it must still work. Empty is the correct default: no departure
            // has been accepted, so nothing is excused.
            let tombstones = { tide: {}, current: {} };
            try {
              tombstones = JSON.parse(fs.readFileSync("data/slug-tombstones.json", "utf8"));
            } catch (err) {
              if (err.code !== "ENOENT") throw err;
            }
            const problems = checkSlugTable(prev, now, tombstones);
            if (problems.length) { for (const p of problems) console.error("  " + p); process.exit(1); }
            console.log("no published slug moved since " + process.env.PREV);
          ' --input-type=module
      # data/corrections.json is compiled from the YAML and committed, because
      # browsers cannot read the YAML off disk. A PR that edits the YAML and
      # not the artifact would ship them out of step - this catches that.
      - run: npm run check:data
      - run: npm pack --dry-run
